<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의함 · 새싹 공방 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{--paper:#EEF0EA;--ink:#1E2629;--ink2:#4E5A5D;--line:#C9D0C4;--cobalt:#2747A0;--red:#A33A2A;--green:#2C6E49}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,"Malgun Gothic",sans-serif;font-size:16px;word-break:keep-all}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
  h1{font-size:22px;margin:0 0 14px}
  .login{display:flex;gap:8px}
  input[type=password]{flex:1;min-width:0;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:12px 16px;background:var(--cobalt);color:#fff;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .err{color:var(--red);font-weight:700}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
  .summary div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .summary b{display:block;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
  .summary .late b{color:var(--red)}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filters button{padding:8px 12px;font-size:14px}
  .filters button[aria-pressed=false]{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
  .item.late{border:2px solid var(--red)}
  .meta{font-size:13px;color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
  .name{font-size:18px;font-weight:800;margin:4px 0}
  .contact{font:inherit;background:none;border:0;padding:0;color:var(--cobalt);text-decoration:underline;font-weight:600}
  .msg{margin:8px 0;white-space:pre-wrap}
  .status{display:flex;gap:6px}
  .status button{flex:1;padding:10px 4px;font-size:14px;background:#fff;color:var(--ink);border:1px solid var(--line)}
  .status button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .lateTag{color:var(--red);font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <h1>새싹 공방 문의함</h1>
  <div id="loginBox" class="login"><input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="current-password"><button id="go">열기</button></div>
  <p id="err" class="err" role="alert"></p>
  <div id="app" hidden>
    <div class="summary">
      <div><small>새 문의</small><b id="newCount">0</b></div>
      <div class="late"><small>48시간 넘게 답장 안 한 문의</small><b id="lateCount">0</b></div>
    </div>
    <div class="filters" id="filters">
      <button data-f="새 문의" aria-pressed="true">새 문의</button>
      <button data-f="연락함" aria-pressed="false">연락함</button>
      <button data-f="완료" aria-pressed="false">완료</button>
      <button data-f="전체" aria-pressed="false">전체</button>
      <button class="ghost" id="reload">새로고침</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
var KEY = 'sprout-admin-pass', rows = [], filter = '새 문의', STATUSES = ['새 문의', '연락함', '완료'];
var DAY48 = 48 * 3600 * 1000;
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pass() { try { return sessionStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function isLate(x) { return x.status === '새 문의' && Date.now() - new Date(x.created_at).getTime() > DAY48; }
async function api(method, body) {
  var r = await fetch('/api/admin', { method: method, headers: { 'Content-Type': 'application/json', 'x-admin-password': pass() }, body: body ? JSON.stringify(body) : undefined });
  var j = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(j.error || '불러오지 못했어요.');
  return j;
}
async function load() {
  document.getElementById('err').textContent = '';
  try {
    rows = (await api('GET')).rows || [];
    document.getElementById('loginBox').hidden = true; document.getElementById('app').hidden = false; render();
  } catch (e) {
    document.getElementById('err').textContent = e.message;
    if (/비밀번호/.test(e.message)) { try { sessionStorage.removeItem(KEY); } catch (_) {} document.getElementById('loginBox').hidden = false; var pw = document.getElementById('pw'); pw.value = ''; pw.focus(); }
  }
}
function render() {
  document.getElementById('newCount').textContent = rows.filter(function (x) { return x.status === '새 문의'; }).length;
  var late = rows.filter(isLate);
  document.getElementById('lateCount').textContent = late.length;
  var shown = rows.filter(function (x) { return filter === '전체' || x.status === filter; });
  shown.sort(function (a, b) { return (isLate(b) - isLate(a)) || (a.created_at < b.created_at ? 1 : -1); });
  document.getElementById('list').innerHTML = shown.length ? shown.map(function (x) {
    var d = new Date(x.created_at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return '<div class="item' + (isLate(x) ? ' late' : '') + '"><div class="meta"><span>' + esc(d) + '</span>' + (isLate(x) ? '<span class="lateTag">48시간 지남</span>' : '') + '</div>' +
      '<div class="name">' + esc(x.name) + '</div><button class="contact" data-copy="' + esc(x.contact) + '">' + esc(x.contact) + ' (눌러서 복사)</button>' +
      (x.message ? '<p class="msg">' + esc(x.message) + '</p>' : '') +
      '<div class="status">' + STATUSES.map(function (s) { return '<button data-id="' + x.id + '" data-s="' + s + '" aria-pressed="' + (x.status === s) + '">' + s + '</button>'; }).join('') + '</div></div>';
  }).join('') : '<p>이 상태의 문의가 없어요.</p>';
}
document.getElementById('go').onclick = function () { try { sessionStorage.setItem(KEY, document.getElementById('pw').value); } catch (e) {} load(); };
document.getElementById('pw').onkeydown = function (e) { if (e.key === 'Enter') document.getElementById('go').click(); };
document.getElementById('reload').onclick = load;
document.getElementById('filters').onclick = function (e) {
  var f = e.target.dataset.f; if (!f) return; filter = f;
  this.querySelectorAll('[data-f]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.f === f); }); render();
};
document.getElementById('list').onclick = async function (e) {
  var t = e.target;
  if (t.dataset.copy) { navigator.clipboard.writeText(t.dataset.copy).then(function () { t.textContent = t.dataset.copy + ' (복사됨)'; }, function () {}); return; }
  if (t.dataset.s) {
    try { await api('PATCH', { id: Number(t.dataset.id), status: t.dataset.s }); var r = rows.find(function (x) { return x.id == t.dataset.id; }); if (r) r.status = t.dataset.s; render(); }
    catch (err) { document.getElementById('err').textContent = err.message; }
  }
};
if (pass()) load();
</script>
</body>
</html>
